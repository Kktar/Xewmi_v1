name: sunu_tikeu
description: Sunu Tikeu - Plateforme de billetterie événementielle au Sénégal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6
  google_sign_in: ^7.2.0

  # UI & Utils
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  #file_picker: ^8.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  share_plus: ^10.1.4
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  uuid: ^4.4.0
  http: ^1.2.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  timeago: ^3.6.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.14.3
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
